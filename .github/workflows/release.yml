name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  approval:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.approval.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - id: approval
        run: node scripts/release-pr.mjs gate

  verify:
    needs: approval
    if: needs.approval.outputs.release == 'true'
    # The reusable workflow declares an owner-only recovery publisher. Its
    # permissions must fit this caller even though closed PRs skip that job.
    # All regular verification jobs retain contents: read.
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/pr-ci.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  archives:
    needs: verify
    uses: ./.github/workflows/release-archives.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  publish:
    needs: [verify, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create only the approved annotated tag
        run: node scripts/release-pr.mjs tag
      - name: Publish the approved notes and verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_NOTES_FILE: docs/release-notes.md
        run: node scripts/release-upload.mjs

  npm-publish:
    needs: [publish, archives]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      OUTASK_NPM_OWNER: ${{ vars.OUTASK_NPM_OWNER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Publish through npm trusted publishing or report first-publication handoff
        run: node scripts/npm-release.mjs

  github-packages:
    needs: [publish, archives]
    if: github.repository == 'henryh/outask'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist
      - name: Publish the accepted payload to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-packages-release.mjs

  downloaded-acceptance:
    needs: [publish, npm-publish, github-packages]
    if: always() && needs.publish.result == 'success' && needs.npm-publish.result == 'success' && (needs.github-packages.result == 'success' || needs.github-packages.result == 'skipped')
    uses: ./.github/workflows/release-downloads.yml
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      require-npm: ${{ github.repository == 'henryh/outask' }}

  mcp-registry:
    needs: downloaded-acceptance
    if: github.repository == 'henryh/outask'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.13
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Check the descriptor and look for the exact version
        id: registry
        run: node scripts/mcp-registry.mjs status
      - name: Install cosign
        if: steps.registry.outputs.exists == 'false'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --silent --show-error --location --output "$archive" "$base_url/$archive"
          curl --fail --silent --show-error --location --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar -xzf "$archive" mcp-publisher
      - name: Validate with the official MCP Registry
        if: steps.registry.outputs.exists == 'false'
        run: '"$RUNNER_TEMP/mcp-publisher" validate app/mcp/server.json'
      - name: Authenticate and publish to the official MCP Registry
        if: steps.registry.outputs.exists == 'false'
        shell: bash
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish app/mcp/server.json
      - name: Verify the exact public MCP Registry entry
        if: steps.registry.outputs.exists == 'false'
        run: node scripts/mcp-registry.mjs verify
