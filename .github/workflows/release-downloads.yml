name: Downloaded release acceptance

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  downloaded-acceptance:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.3', '24']
        os: [ubuntu-latest, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Locked dependencies and audit
        run: node scripts/ci.mjs dependencies
      - name: Download and accept the published archive natively
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ci.mjs downloaded
      - name: Download and accept the public npm package or report bootstrap pending
        if: ${{ hashFiles('scripts/npm-release.mjs') != '' }}
        run: node scripts/ci.mjs npm-downloaded
